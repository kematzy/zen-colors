name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Newest first (no functional requirement; jobs still run in parallel)
        node-version: [24, 22, 20]
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      # Optional quality gate; cspell@10 needs modern Node — keep on v24 only
      - name: Spellcheck
        if: matrix.node-version == 24
        run: npm run spellcheck
      - run: npm run test:coverage
      - run: npm run build
