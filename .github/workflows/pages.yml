name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  pages: write

concurrency:
  cancel-in-progress: true
  group: pages

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          cache: npm
          node-version: 24
      - run: npm ci
      - run: npm run demo:build
      # v5 uses a modern upload-artifact (avoids Node 20 deprecation warnings)
      - uses: actions/upload-pages-artifact@v5
        with:
          path: demo/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      # deploy-pages@v5 targets a modern Node runtime (Node 20 deprecation on @v4)
      - id: deployment
        uses: actions/deploy-pages@v5
