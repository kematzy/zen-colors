<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>@kematzy/zen-colors — social preview</title>
    <meta
      name="description"
      content="Source for assets/social-preview.png (GitHub 1280×640). Re-render with Playwright after edits."
    />
    <!--
      Swatch colors computed with @kematzy/zen-colors (tint/shade in OKLCH).

      Row 1 surface: oklch(52.1% 0.023 104) → tint 70…10 + base + shade 10…70
      Row 2 primary: oklch(39.42% 0.0865 137) → tint 60…10 + base + shade 10…60
      Row 3 warning: oklch(56.3% 0.123 68) → tint 50…10 + base + shade 10…50

      Re-render PNG (from repo root):
        node assets/render-social-preview.mjs
    -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Roboto+Mono:wght@400;500&display=swap');

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        width: 1280px;
        height: 640px;
        overflow: hidden;
        font-family: 'Montserrat', system-ui, sans-serif;
        color: oklch(92% 0.01 103);
        background: oklch(14% 0.012 103);
      }

      .frame {
        width: 1280px;
        height: 640px;
        position: relative;
        padding: 48px 64px 44px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        background:
          radial-gradient(ellipse 70% 80% at 88% 12%, oklch(30% 0.06 138 / 0.8), transparent 55%),
          radial-gradient(ellipse 55% 55% at 8% 92%, oklch(26% 0.05 242 / 0.48), transparent 50%),
          linear-gradient(145deg, oklch(16% 0.014 103), oklch(11% 0.01 103));
      }

      .frame::before {
        content: '';
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(oklch(100% 0 0 / 0.03) 1px, transparent 1px),
          linear-gradient(90deg, oklch(100% 0 0 / 0.03) 1px, transparent 1px);
        background-size: 40px 40px;
        mask-image: radial-gradient(ellipse 80% 70% at 50% 40%, black, transparent);
        pointer-events: none;
      }

      .top,
      .bottom {
        position: relative;
        z-index: 1;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        font-family: 'Roboto Mono', ui-monospace, monospace;
        font-size: 17px;
        font-weight: 500;
        letter-spacing: 0.02em;
        color: oklch(78% 0.04 138);
        background: oklch(22% 0.02 138 / 0.55);
        border: 1px solid oklch(45% 0.06 138 / 0.45);
        border-radius: 999px;
        padding: 8px 16px 8px 12px;
        margin-bottom: 22px;
      }

      .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: oklch(62% 0.14 138);
        box-shadow: 0 0 12px oklch(62% 0.14 138 / 0.7);
      }

      h1 {
        font-size: 64px;
        font-weight: 700;
        letter-spacing: -0.03em;
        line-height: 1.05;
        color: oklch(96% 0.008 103);
      }

      h1 .scope {
        color: oklch(66% 0.008 103);
        font-weight: 600;
      }

      .tagline {
        margin-top: 16px;
        max-width: 880px;
        font-size: 32px;
        font-weight: 500;
        line-height: 1.3;
        color: oklch(78% 0.02 103);
      }

      .tagline em {
        font-style: normal;
        color: oklch(83% 0.02 103);
        font-weight: 600;
      }

      .bottom {
        display: flex;
        flex-direction: column;
        gap: 14px;
      }

      .scale-block {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .scale-label {
        font-family: 'Roboto Mono', ui-monospace, monospace;
        font-size: 20px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: oklch(62% 0.02 103);
      }

      .scale-label.secondary {
        font-size: 15px;
        letter-spacing: 0.05em;
        color: oklch(56% 0.018 103);
      }

      .scale {
        display: flex;
        gap: 8px;
        height: 60px;
      }

      .scale.roles {
        height: 50px;
        gap: 0;
      }

      .role-group {
        display: flex;
        flex: 1;
        gap: 5px;
        min-width: 0;
      }

      .role-group + .role-group {
        margin-left: 12px;
      }

      .swatch {
        flex: 1;
        min-width: 0;
        border-radius: 10px;
        box-shadow: inset 0 0 0 1px oklch(100% 0 0 / 0.08);

        display: flex;
        justify-content: center;
        padding: 2px 4px;
        font-size: 12px;
        align-items: center;
      }

      .swatch.base {
        box-shadow:
          inset 0 0 0 1px oklch(80% 0 0 / 0.42),
          0 0 0 1px oklch(100% 0 0 / 0.06);
      }

      .meta {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 4px;
        font-family: 'Roboto Mono', ui-monospace, monospace;
        font-size: 15px;
        color: oklch(58% 0.02 103);
      }

      .meta strong {
        color: oklch(80% 0.03 103);
        font-weight: 500;
      }
    </style>
  </head>
