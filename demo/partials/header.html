<!-- Header -->
<header id="site-header" class="">
  <!-- #logo -->
  <div id="logo" class="">
    <a
      href="#"
      @click.prevent="mode = skipIntro ? 'scale' : 'intro'"
      class="text-4xl font-normal text-theme-primary-t02 pl-6 pr-4 lg:pr-8"
    >
      zen-colors
    </a>
  </div>
  <!-- /#logo -->

  <!-- #inputs -->
  <div id="inputs" class="">
    <div class="relative">
      <button
        type="button"
        class="h-10 w-10 cursor-pointer rounded-lg border bg-theme-border shadow-sm"
        :style="`background:${headerSwatch()}`"
        @click="showSliders = !showSliders"
        title="OKLCH sliders"
        aria-label="Toggle OKLCH sliders"
      ></button>

      <!-- overlay: color sliders -->
      <div
        x-show="showSliders"
        x-transition
        @click.outside="showSliders = false"
        class="absolute top-12 left-0 z-50 w-72 rounded-xl border bg-theme-t01 p-4 shadow-xl"
      >
        <p class="mb-3 text-xs font-semibold tracking-wide text-theme-fg-muted uppercase">OKLCH</p>

        <div class="space-y-3">
          <label class="slider-row">
            <span>L</span>
            <input
              type="range"
              min="0"
              max="100"
              step="0.1"
              x-model.number="oklch.l"
              @input="applyFromSliders()"
            />
            <span class="text-right font-mono" x-text="oklch.l.toFixed(1)"></span>
          </label>
          <label class="slider-row">
            <span>C</span>
            <input
              type="range"
              min="0"
              max="0.4"
              step="0.001"
              x-model.number="oklch.c"
              @input="applyFromSliders()"
            />
            <span class="text-right font-mono" x-text="oklch.c.toFixed(3)"></span>
          </label>
          <label class="slider-row">
            <span>H</span>
            <input
              type="range"
              min="0"
              max="360"
              step="0.1"
              x-model.number="oklch.h"
              @input="applyFromSliders()"
            />
            <span class="text-right font-mono" x-text="oklch.h.toFixed(1)"></span>
          </label>
          <label class="slider-row">
            <span>α</span>
            <input
              type="range"
              min="0"
              max="1"
              step="0.01"
              x-model.number="oklch.alpha"
              @input="applyFromSliders()"
            />
            <span class="text-right font-mono" x-text="oklch.alpha.toFixed(2)"></span>
          </label>
        </div>
      </div>
      <!-- /overlay: color sliders -->
    </div>

    <input
      id="color-input"
      type="text"
      class="input w-60 lg:w-80 font-mono"
      :class="{ error: error }"
      x-model="colorInput"
      placeholder="#0af · oklch(…%) · rgb(…)"
      spellcheck="false"
      autocomplete="off"
    />

    <div class="flex items-center gap-1">
      <input
        type="number"
        id="weight"
        min="2"
        max="25"
        step="1"
        class="input w-20 text-center font-mono px-2"
        x-model.number="weight"
        title="Scale weight 2–25"
      />
      <span class="hidden text-sm text-theme-fg-muted sm:inline pl-2">weight</span>
    </div>
  </div>
  <!-- /#inputs -->

  <div id="buttons" class="">
    <a
      class="btn-icon"
      href="https://github.com/kematzy/zen-colors"
      target="_blank"
      rel="noreferrer"
    >
      <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewBox="0 0 24 24">
        <path
          fill="currentColor"
          d="M12 2A10 10 0 0 0 2 12c0 4.42 2.87 8.17 6.84 9.5c.5.08.66-.23.66-.5v-1.69c-2.77.6-3.36-1.34-3.36-1.34c-.46-1.16-1.11-1.47-1.11-1.47c-.91-.62.07-.6.07-.6c1 .07 1.53 1.03 1.53 1.03c.87 1.52 2.34 1.07 2.91.83c.09-.65.35-1.09.63-1.34c-2.22-.25-4.55-1.11-4.55-4.92c0-1.11.38-2 1.03-2.71c-.1-.25-.45-1.29.1-2.64c0 0 .84-.27 2.75 1.02c.79-.22 1.65-.33 2.5-.33s1.71.11 2.5.33c1.91-1.29 2.75-1.02 2.75-1.02c.55 1.35.2 2.39.1 2.64c.65.71 1.03 1.6 1.03 2.71c0 3.82-2.34 4.66-4.57 4.91c.36.31.69.92.69 1.85V21c0 .27.16.59.67.5C19.14 20.16 22 16.42 22 12A10 10 0 0 0 12 2"
        />
      </svg>
    </a>

    <button
      type="button"
      class="btn-icon"
      @click="copyShareUrl()"
      title="Copy share URL"
      aria-label="Copy share URL"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="18"
        height="18"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <circle cx="18" cy="5" r="3" />
        <circle cx="6" cy="12" r="3" />
        <circle cx="18" cy="19" r="3" />
        <line x1="8.59" x2="15.42" y1="13.51" y2="17.49" />
        <line x1="15.41" x2="8.59" y1="6.51" y2="10.49" />
      </svg>
    </button>

    <button
      type="button"
      class="btn-icon"
      @click="toggleTheme()"
      :aria-label="theme === 'dark' ? 'Light mode' : 'Dark mode'"
    >
      <svg
        x-show="theme === 'dark'"
        xmlns="http://www.w3.org/2000/svg"
        width="18"
        height="18"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
      >
        <circle cx="12" cy="12" r="4" />
        <path
          d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"
        />
      </svg>
      <svg
        x-show="theme === 'light'"
        xmlns="http://www.w3.org/2000/svg"
        width="18"
        height="18"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
      >
        <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z" />
      </svg>
    </button>

    <button
      type="button"
      class="btn-icon"
      @click="toggleDrawer()"
      :aria-label="drawerOpen ? 'Close drawer' : 'Open drawer'"
    >
      <svg
        x-show="!drawerOpen"
        xmlns="http://www.w3.org/2000/svg"
        width="18"
        height="18"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
      >
        <path d="M4 6h16M4 12h16M4 18h16" />
      </svg>
      <svg
        x-show="drawerOpen"
        xmlns="http://www.w3.org/2000/svg"
        width="18"
        height="18"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
      >
        <path d="M18 6 6 18M6 6l12 12" />
      </svg>
    </button>
  </div>
  <!-- /#buttons -->

  <!-- #navbar -->
  <nav id="navbar" class="px-4">
    <template
      x-for="item in [
            { id: 'intro', label: 'Intro' },
            { id: 'scale', label: 'Scale' },
            { id: 'methods', label: 'Methods' },
            { id: 'contrast', label: 'Contrast' },
            { id: 'docs', label: 'Docs' },
            { id: 'api', label: 'API' },
          ]"
      :key="item.id"
    >
      <button
        type="button"
        class="nav-link"
        :class="{ active: mode === item.id }"
        @click="mode = item.id; if (item.id === 'api') runApiDemo()"
        x-text="item.label"
      ></button>
    </template>
  </nav>
  <!-- /#navbar -->
</header>
