<!-- ========== CONTRAST ========== -->
<section x-show="mode === 'contrast'" class="page-pad space-y-6">
  <div class="flex flex-wrap items-end gap-4">
    <label class="text-sm">
      <span class="mb-1 block text-theme-fg-muted">Against</span>
      <input type="text" class="input w-40 font-mono" x-model="contrastAgainst" />
    </label>
    <label class="text-sm">
      <span class="mb-1 block text-theme-fg-muted">on() target ratio</span>
      <input
        type="number"
        min="1"
        max="21"
        step="0.1"
        class="input w-24"
        x-model.number="onRatio"
      />
    </label>
  </div>

  <div class="grid gap-4 md:grid-cols-3">
    <div class="panel">
      <h3 class="panel-title-code">.contrast(against)</h3>
      <template x-if="contrastReport()">
        <div class="mt-3 space-y-2 text-sm">
          <p
            class="font-mono text-2xl font-semibold"
            x-text="contrastReport().ratio.toFixed(2) + ' : 1'"
          ></p>

          <div class="flex flex-wrap gap-1">
            <span class="badge" :class="contrastReport().passes.aa ? 'badge-pass' : 'badge-fail'">
              AA
            </span>
            <span
              class="badge"
              :class="contrastReport().passes.aaLarge ? 'badge-pass' : 'badge-fail'"
            >
              AA large
            </span>
            <span class="badge" :class="contrastReport().passes.aaa ? 'badge-pass' : 'badge-fail'">
              AAA
            </span>
            <span
              class="badge"
              :class="contrastReport().passes.aaaLarge ? 'badge-pass' : 'badge-fail'"
            >
              AAA large
            </span>
          </div>

          <p class="text-xs text-theme-fg-muted">
            Current is <span x-text="contrastReport().current"></span>
          </p>
        </div>
      </template>
    </div>

    <div class="panel">
      <h3 class="panel-title-code">.fg()</h3>

      <p>Best black/white on this color as background.</p>
      <template x-if="foregroundOnBase()">
        <div class="mt-3 flex overflow-hidden rounded-lg border border-theme-border">
          <div
            class="flex h-24 flex-1 items-center justify-center text-sm font-semibold"
            :style="`background:${baseColor.hexString()};color:${foregroundOnBase().hexString()}`"
          >
            Sample text
          </div>
        </div>
      </template>
    </div>

    <div class="panel">
      <h3 class="panel-title-code">.on(ratio)</h3>

      <p>Tint/shade of current color that meets the ratio.</p>
      <template x-if="onTarget()">
        <div class="mt-3">
          <div
            class="h-16 rounded-lg border border-theme-border"
            :style="`background:${onTarget().hexString()}`"
          ></div>

          <p class="mt-2 font-mono text-xs" x-text="onTarget().oklchString()"></p>

          <p class="font-mono text-xs" x-text="onTarget().hexString()"></p>
        </div>
      </template>
    </div>
  </div>

  <div class="panel overflow-x-auto">
    <h3 class="font-semibold">Scale vs white / black</h3>
    <table class="mt-3 w-full min-w-lg text-left text-xs">
      <thead class="text-theme-fg-muted">
        <tr>
          <th class="py-1 pr-3">Step</th>
          <th class="py-1 pr-3">Swatch</th>
          <th class="py-1 pr-3">vs white</th>
          <th class="py-1 pr-3">AA</th>
          <th class="py-1 pr-3">vs black</th>
          <th class="py-1">AA</th>
        </tr>
      </thead>
      <tbody>
        <template x-for="(row, i) in contrastMatrix()" :key="'m'+i">
          <tr class="border-t border-t-theme-border">
            <td class="py-1.5 pr-3 font-mono" x-text="row.step.type + ' ' + row.step.weight"></td>
            <td class="py-1.5 pr-3">
              <span
                class="inline-block h-5 w-10 rounded"
                :style="`background:${row.step.hexString()}`"
              ></span>
            </td>
            <td class="py-1.5 pr-3 font-mono" x-text="row.vsWhite.ratio.toFixed(2)"></td>
            <td class="py-1.5 pr-3">
              <span
                class="badge"
                :class="row.vsWhite.passes.aa ? 'badge-pass' : 'badge-fail'"
                x-text="row.vsWhite.passes.aa ? 'pass' : 'fail'"
              ></span>
            </td>
            <td class="py-1.5 pr-3 font-mono" x-text="row.vsBlack.ratio.toFixed(2)"></td>
            <td class="py-1.5">
              <span
                class="badge"
                :class="row.vsBlack.passes.aa ? 'badge-pass' : 'badge-fail'"
                x-text="row.vsBlack.passes.aa ? 'pass' : 'fail'"
              ></span>
            </td>
          </tr>
        </template>
      </tbody>
    </table>
  </div>
</section>
