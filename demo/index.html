<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Zen Colors — create perceptual color tints, shades and scales easily"
    />
    <title>Zen Colors — perceptual tints, shades & scales</title>
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="./favicon-16x16.png" />
    <link rel="icon" href="./favicon.ico" sizes="any" />
    <link rel="manifest" href="./site.webmanifest" />
  </head>
  <body x-data="app()" x-cloak class="theme-dark">
    <div x-show="showToast" x-transition class="toast" x-text="toastMessage"></div>

    <!-- prettier-ignore -->
    {{> header }}
    <!-- prettier-ignore -->
    {{> error-banner }}

    <main>
      <!-- prettier-ignore -->
      {{> page-intro }}
      <!-- prettier-ignore -->
      {{> page-scale }}
      <!-- prettier-ignore -->
      {{> page-methods }}
      <!-- prettier-ignore -->
      {{> page-contrast }}
      <!-- prettier-ignore -->
      {{> page-docs }}
      <!-- prettier-ignore -->
      {{> page-api }}
    </main>

    <!-- prettier-ignore -->
    {{> drawer }}
    <!-- prettier-ignore -->
    {{> footer }}

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
